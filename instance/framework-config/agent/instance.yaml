workflow: jira-sprint
source: jira
# OpenCode V2/OpenAI profile. Removing these selectors restores Python/Claude
# runtime defaults; native subagents and MCP settings apply only to OpenCode.
runtime: opencode
provider: rehor-openai
model: gpt-6.1-terra
image:
  repository: quay.io/redhat-services-prod/hcc-platex-services/hcc-framework-agent-dev
  tag: latest
env:
  BOT_INSTANCE_ID: Řehoř Hrubý z Jelení
  BOT_LABEL: hcc-ai-bot
  BOT_BOARD_NAME: HCC Framework
  BOT_SPRINT_PREFIX: HCC framework Sprint
  BOT_INCLUDE_BACKLOG: 'true'
  BOT_CONFIG_PATH: instance/framework-config
  BOT_EXECUTION_ENGINE: coordinator
preflights:
  - gh-pr-status
  - gl-mr-status
  - id: jira-sprint
    with:
      label: hcc-ai-bot
      include_backlog: true
# Legacy KEDA window of devbot-framework (deploy/template defaults): the
# dispatcher starts no sessions outside it; in-flight sessions drain.
schedule:
  triggers:
    - timezone: Europe/Prague
      start: "0 9 * * 1-5"
      end: "0 23 * * 1-5"
envs:
  - node
  - go
  - patternfly-mcp
  - slack
  - container-scan
  - browser
claude_md:
  strategy: append
