# Test Anti-Pattern Configuration
#
# This file defines detectable test anti-patterns with severity levels,
# remediation guidance, and ESLint rule recommendations.
#
# Each pattern includes:
#   - severity: high | medium | low (affects notification priority)
#   - message: Short description shown in reports
#   - recommendation: Specific guidance for fixing the issue
#   - examples: Code examples showing the problem and fix
#   - eslint_rules: Applicable ESLint rules to prevent the issue (or null if not applicable)

anti_patterns:
  # === HIGH SEVERITY ===
  # These create flaky, unreliable tests

  hard_coded_sleep:
    severity: high
    message: "Hard-coded sleep/wait detected"
    recommendation: "Use proper waits (waitFor, until, expect.toPass) instead of fixed delays"
    eslint_rules:
      - name: "no-restricted-syntax"
        config: |
          // Add to .eslintrc.js rules:
          "no-restricted-syntax": [
            "error",
            {
              "selector": "CallExpression[callee.name='setTimeout']",
              "message": "Avoid setTimeout in tests. Use waitFor or other proper waits."
            },
            {
              "selector": "CallExpression[callee.object.name='Promise'][callee.property.name='resolve']",
              "message": "Avoid Promise-based delays. Use Playwright's built-in wait methods."
            }
          ]
        note: "Catches setTimeout and Promise-based delays in test code"
      - name: "@typescript-eslint/no-magic-numbers"
        config: |
          // Add to .eslintrc.js rules:
          "@typescript-eslint/no-magic-numbers": [
            "error",
            {
              "ignore": [0, 1, -1],
              "ignoreEnums": true,
              "ignoreNumericLiteralTypes": true
            }
          ]
        note: "Can catch hard-coded timeout values like setTimeout(5000)"
    examples:
      bad: |
        // ❌ BAD: Hard-coded delay
        await page.click('#submit');
        await new Promise(r => setTimeout(r, 5000));
        expect(page.locator('.success')).toBeVisible();

      good: |
        // ✅ GOOD: Wait for specific condition
        await page.click('#submit');
        await expect(page.locator('.success')).toBeVisible();

  missing_assertions:
    severity: high
    message: "Test with no assertions detected"
    recommendation: "Add expect() assertions to verify test outcomes"
    eslint_rules: null
    note: "No standard ESLint rule for this pattern. Consider custom rule or test coverage tools."
    examples:
      bad: |
        // ❌ BAD: No verification
        it('should load data', async () => {
          await fetchData();
        });

      good: |
        // ✅ GOOD: Verifies behavior
        it('should load data', async () => {
          const data = await fetchData();
          expect(data).toBeDefined();
          expect(data.length).toBeGreaterThan(0);
        });

  error_swallowing_catch:
    severity: high
    message: "Empty catch block or error handler swallows errors"
    recommendation: "Either handle the error, re-throw, or fail the test explicitly"
    eslint_rules:
      - name: "no-empty"
        config: |
          // Add to .eslintrc.js rules:
          "no-empty": [
            "error",
            {
              "allowEmptyCatch": false
            }
          ]
        note: "Catches empty catch blocks"
      - name: "@typescript-eslint/no-unused-vars"
        config: |
          // Add to .eslintrc.js rules:
          "@typescript-eslint/no-unused-vars": [
            "error",
            {
              "args": "all",
              "argsIgnorePattern": "^_",
              "caughtErrors": "all"
            }
          ]
        note: "Catches unused error variables in catch blocks: catch (e) {}"
    examples:
      bad: |
        // ❌ BAD: Empty catch block
        try {
          await somethingThatMightFail();
        } catch (e) {}

        // ❌ BAD: Promise catch returns undefined
        await somethingInTheUI().catch(() => undefined);

        // ❌ BAD: Promise catch returns null
        await fetchData().catch(() => null);

      good: |
        // ✅ GOOD: Fail test on unexpected error
        try {
          await somethingThatMightFail();
        } catch (e) {
          throw new Error(`Unexpected failure: ${e.message}`);
        }

        // ✅ GOOD: Handle specific expected errors
        try {
          await somethingThatMightFail();
        } catch (e) {
          if (e.code !== 'EXPECTED_ERROR') {
            throw e;
          }
          // Handle expected error
        }

        // ✅ GOOD: Explicit failure with context
        await somethingInTheUI().catch((e) => {
          throw new Error(`UI action failed: ${e.message}`);
        });

  missing_auth_package:
    severity: high
    message: "Test imports from @playwright/test instead of @redhat-cloud-services/playwright-test-auth"
    recommendation: "Import test (and optionally expect) from @redhat-cloud-services/playwright-test-auth to get pre-configured auth fixtures. Tests that need unauthenticated access (e.g., public pages) are a valid exception."
    eslint_rules:
      - name: "no-restricted-imports"
        config: |
          // Add to .eslintrc.js rules:
          "no-restricted-imports": [
            "error",
            {
              "paths": [
                {
                  "name": "@playwright/test",
                  "importNames": ["test"],
                  "message": "Import { test } from '@redhat-cloud-services/playwright-test-auth' instead for pre-configured authentication."
                }
              ]
            }
          ]
        note: "Catches direct import of test from @playwright/test. Allows importing expect or other utilities."
    examples:
      bad: |
        // ❌ BAD: Importing test from @playwright/test bypasses auth fixtures
        import { test, expect } from '@playwright/test';

        test('should access dashboard', async ({ page }) => {
          await page.goto('/dashboard');
          // No authentication - test may fail or hit login redirect
        });

      good: |
        // ✅ GOOD: Import from playwright-test-auth for pre-configured auth
        import { test, expect } from '@redhat-cloud-services/playwright-test-auth';

        test('should access dashboard', async ({ page }) => {
          // Already authenticated via fixture
          await page.goto('/dashboard');
          await expect(page.locator('.welcome-message')).toBeVisible();
        });

  # === MEDIUM SEVERITY ===
  # These hide test failures or create maintenance burden

  duplicated_auth_code:
    severity: medium
    message: "Custom login/auth code detected in test - consider using playwright-test-auth fixtures"
    recommendation: "Use playwright-test-auth fixtures for authentication instead of manual login steps. Valid exception: tests that specifically verify login/auth functionality or multi-user scenarios."
    eslint_rules: null
    note: "No ESLint rule for this pattern. This is a code duplication concern best addressed through refactoring to shared fixtures."
    examples:
      bad: |
        // ❌ BAD: Manual login steps in a test that isn't testing auth
        import { test } from '@redhat-cloud-services/playwright-test-auth';

        test('should access dashboard', async ({ page }) => {
          await page.goto('/login');
          await page.fill('#username', 'testuser');
          await page.fill('#password', 'testpass');
          await page.click('button[type="submit"]');
          await page.waitForURL('/dashboard');
          // actual test starts here...
        });

      good: |
        // ✅ GOOD: Auth handled by fixture, test focuses on behavior
        import { test } from '@redhat-cloud-services/playwright-test-auth';

        test('should access dashboard', async ({ page }) => {
          await page.goto('/dashboard');
          // actual test...
        });

        // ✅ ALSO GOOD: Custom auth when testing login flow itself
        test('should show error with invalid credentials', async ({ page }) => {
          await page.goto('/login');
          await page.fill('#username', 'invalid');
          await page.fill('#password', 'wrong');
          await page.click('button[type="submit"]');
          await expect(page.locator('.error-message')).toBeVisible();
        });

  disabled_tests:
    severity: medium
    message: "Disabled or focused test detected"
    recommendation: "Re-enable test or document reason for skip with ticket reference"
    eslint_rules:
      - name: "jest/no-disabled-tests"
        config: |
          // Add to .eslintrc.js (requires eslint-plugin-jest):
          "jest/no-disabled-tests": "error"
        note: "Catches .skip() and xdescribe/xit patterns in Jest/Vitest"
      - name: "playwright/no-skipped-test"
        config: |
          // Add to .eslintrc.js (requires eslint-plugin-playwright):
          "playwright/no-skipped-test": [
            "error",
            {
              "allowConditional": true
            }
          ]
        note: "Catches .skip() in Playwright tests, allows conditional skips"
    examples:
      bad: |
        // ❌ BAD: Commented/skipped with no context
        it.skip('should handle edge case', () => {
          // TODO: fix later
        });

      good: |
        // ✅ GOOD: Documented skip with ticket
        it.skip('should handle edge case', () => {
          // Skipped: JIRA-123 - race condition in CI
          // Re-enable after infrastructure upgrade
        });

  test_only_focused:
    severity: medium
    message: "Focused test detected (.only)"
    recommendation: "Remove .only() - it prevents other tests from running"
    eslint_rules:
      - name: "jest/no-focused-tests"
        config: |
          // Add to .eslintrc.js (requires eslint-plugin-jest):
          "jest/no-focused-tests": "error"
        note: "Catches .only() and fdescribe/fit patterns in Jest/Vitest"
      - name: "playwright/no-focused-test"
        config: |
          // Add to .eslintrc.js (requires eslint-plugin-playwright):
          "playwright/no-focused-test": "error"
        note: "Catches test.only() in Playwright tests"
    examples:
      bad: |
        // ❌ BAD: Blocks other tests
        it.only('debugging this test', () => {
          expect(true).toBe(true);
        });

      good: |
        // ✅ GOOD: Run all tests
        it('debugging this test', () => {
          expect(true).toBe(true);
        });

  # === LOW SEVERITY ===
  # These create noise but don't break tests

  console_log_in_tests:
    severity: low
    message: "Console logging in test"
    recommendation: "Remove debug logs or use proper test logging/reporting"
    eslint_rules:
      - name: "no-console"
        config: |
          // Add to .eslintrc.js rules:
          "no-console": [
            "error",
            {
              "allow": ["warn", "error"]
            }
          ]
        note: "Catches console.log and console.debug, allows console.warn/error"
    examples:
      bad: |
        // ❌ BAD: Debug logging left in
        it('should work', () => {
          console.log('testing...');
          expect(true).toBe(true);
        });

      good: |
        // ✅ GOOD: Use test reporter if needed
        it('should work', () => {
          // Use test.step() or similar for meaningful output
          expect(true).toBe(true);
        });

  todo_comments:
    severity: low
    message: "TODO comment in test"
    recommendation: "Create ticket for TODO or implement the test"
    eslint_rules:
      - name: "no-warning-comments"
        config: |
          // Add to .eslintrc.js rules:
          "no-warning-comments": [
            "warn",
            {
              "terms": ["todo", "fixme", "hack", "xxx"],
              "location": "anywhere"
            }
          ]
        note: "Catches TODO/FIXME/HACK comments (warns instead of errors)"
    examples:
      bad: |
        // ❌ BAD: Untracked TODO
        it('should work', () => {
          // TODO: add more assertions
          expect(true).toBe(true);
        });

      good: |
        // ✅ GOOD: Tracked with ticket
        it('should work', () => {
          // JIRA-456: Add edge case coverage
          expect(true).toBe(true);
        });

# Remediation Guidance

remediation_templates:
  hard_coded_sleep: |
    Replace hard-coded delays with conditional waits:

    **Playwright/Puppeteer:**
    ```javascript
    await expect(page.locator('.element')).toBeVisible();
    ```

    **Selenium:**
    ```java
    WebDriverWait wait = new WebDriverWait(driver, Duration.ofSeconds(10));
    wait.until(ExpectedConditions.visibilityOfElementLocated(By.id("element")));
    ```

    **Cypress:**
    ```javascript
    cy.get('.element').should('be.visible');
    ```

  disabled_tests: |
    Either re-enable or properly document:

    **If the test is flaky:**
    - Investigate root cause (timing, cleanup, state isolation)
    - Fix the flake, don't skip the test
    - Use .retry() for genuinely flaky infrastructure

    **If blocked on external dependency:**
    - Document with ticket: `it.skip('name', () => { /* JIRA-123: waiting on API change */ })`
    - Set a reminder to re-enable
    - Consider mocking the dependency instead
